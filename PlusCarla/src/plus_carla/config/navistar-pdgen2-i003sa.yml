  # Note: In CARLA, positive yaw is applied in the FMCW lidar's local XY plane,
  # which makes it appear clockwise when viewed from above (Z-up). 
  # This is opposite to the standard counter-clockwise convention.
  # To tilt the sensor left in world coordinates, we need to negate the yaw.
  - name: left_aeva_lidar
    is_main_lidar: True
    model: FMCW
    type: lidar
    x: 2.48
    y: -0.097
    z: 1.557
    roll: 0
    pitch: -3.2
    yaw: -10
    config:
      channels: 64
      range: 500
      pattern_name: 64-14.4-ROI-3m-NHF
  - name: right_aeva_lidar
    model: FMCW
    type: lidar
    x: 2.48
    y: 0.097
    z: 1.557
    roll: 0
    pitch: -3.2
    yaw: 10
    config:
      channels: 64
      range: 500
      pattern_name: 64-14.4-ROI-3m-NHF
  - name: left_OS0_lidar
    model: LiDAR
    type: lidar
    x: 0.722
    y: -1.231
    z: -0.145
    roll: -35
    pitch: 0
    yaw: 0
    config:
      channels: 128
      range: 75
      horizontal_fov: 360
      upper_fov: 45
      lower_fov: -45
      points_per_second: 2620000
      rotation_frequency: 20
      pattern_name: Ouster0
  - name: right_OS0_lidar
    model: LiDAR
    type: lidar
    x: 0.722
